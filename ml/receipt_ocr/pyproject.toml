[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hoadon-receipt-ocr"
version = "0.1.0"
description = "Reproducible Vietnamese receipt OCR fine-tuning utilities"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0,<13.0", "PyYAML>=6.0,<7.0"]

[tool.setuptools.packages.find]
include = ["receipt_ocr*"]
