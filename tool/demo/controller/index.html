<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finmi – Trang điều khiển demo</title>
<style>
  :root {
    --bg: #f4f5f7; --fg: #1d2127; --panel: #ffffff; --line: #d5d9e0;
    --red: #c62828; --green: #1b7f3b; --accent: #1f4fd8; --muted: #5a6270;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --fg: #e8eaee; --panel: #1e232b; --line: #343b46;
      --red: #e05a5a; --green: #4cb86b; --accent: #7aa2ff; --muted: #9aa3b2;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header.bar {
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 20px;
    align-items: center;
  }
  header.bar h1 { font-size: 16px; margin: 0; width: 100%; }
  fieldset {
    border: 1px solid var(--line); border-radius: 8px; margin: 0;
    padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 6px 12px;
    align-items: center; min-width: 0;
  }
  legend { font-size: 12px; color: var(--muted); padding: 0 4px; }
  label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  button {
    font: inherit; color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; min-height: 40px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.danger { border-color: var(--red); color: var(--red); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #status { font-size: 12px; color: var(--muted); width: 100%; min-height: 1.4em; }
  main.frames {
    flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px; padding: 8px;
  }
  section.pane {
    display: flex; flex-direction: column; min-width: 0; min-height: 0;
    border: 2px solid var(--line); border-radius: 8px; overflow: hidden;
    background: var(--panel);
  }
  section.pane h2 { margin: 0; font-size: 15px; padding: 6px 12px; color: #fff; }
  #pane-b0 { border-color: var(--red); }
  #pane-b0 h2 { background: var(--red); }
  #pane-b1 { border-color: var(--green); }
  #pane-b1 h2 { background: var(--green); }
  @media (prefers-color-scheme: dark) {
    section.pane h2 { color: #111; }
  }
  iframe { flex: 1; width: 100%; min-height: 0; border: 0; background: #fff; }
  @media (max-width: 760px) {
    main.frames { grid-template-columns: 1fr; grid-auto-rows: 85vh; overflow-y: auto; }
    header.bar { padding: 8px; }
  }
</style>
</head>
<body>
<header class="bar" role="region" aria-label="Thanh điều khiển">
  <h1>Finmi – Điều khiển demo (một lệnh, hai bản)</h1>

  <fieldset>
    <legend>Gửi cho</legend>
    <label><input type="radio" name="target" value="both" checked> Cả hai</label>
    <label><input type="radio" name="target" value="b0"> Chỉ B0</label>
    <label><input type="radio" name="target" value="b1"> Chỉ B1</label>
  </fieldset>

  <fieldset>
    <legend>Câu hỏi mẫu</legend>
    <button type="button" class="ask" data-question="Tháng này tôi chi bao nhiêu?">Tháng này tôi chi bao nhiêu?</button>
    <button type="button" class="ask" data-question="Tại sao tháng này tôi chi nhiều?">Tại sao tháng này tôi chi nhiều?</button>
    <button type="button" class="ask" data-question="Hôm nay ăn trưa hết 35k">Hôm nay ăn trưa hết 35k</button>
  </fieldset>

  <fieldset>
    <legend>Lỗi giả lập</legend>
    <label><input type="radio" name="fault" value="" checked> Không</label>
    <label><input type="radio" name="fault" value="429"> 429</label>
    <label><input type="radio" name="fault" value="500"> 500</label>
    <label><input type="radio" name="fault" value="timeout"> timeout</label>
  </fieldset>

  <fieldset>
    <legend>Hóa đơn</legend>
    <label><input type="checkbox" id="tamper"> Bóp méo tổng hóa đơn (lỗi mô phỏng)</label>
    <button type="button" class="asset" data-asset="assets/ai_lab/receipt_normal.png">Hóa đơn mẫu 1</button>
    <button type="button" class="asset" data-asset="assets/ai_lab/receipt_repeat.png">Hóa đơn mẫu 2</button>
  </fieldset>

  <button type="button" id="reset" class="danger">Reset</button>
  <div id="status" role="status" aria-live="polite"></div>
</header>

<main class="frames">
  <section class="pane" id="pane-b0" aria-labelledby="t-b0">
    <h2 id="t-b0">B0 – GỐC</h2>
    <iframe id="frame-b0" title="B0 – GỐC" src="http://localhost:8080/"></iframe>
  </section>
  <section class="pane" id="pane-b1" aria-labelledby="t-b1">
    <h2 id="t-b1">B1 – TỐI ƯU</h2>
    <iframe id="frame-b1" title="B1 – TỐI ƯU" src="http://localhost:8081/"></iframe>
  </section>
</main>

<script>
(function () {
  'use strict';
  var FRAMES = {
    b0: { el: document.getElementById('frame-b0'), origin: 'http://localhost:8080' },
    b1: { el: document.getElementById('frame-b1'), origin: 'http://localhost:8081' }
  };
  var statusEl = document.getElementById('status');

  function targets() {
    var v = document.querySelector('input[name="target"]:checked').value;
    return v === 'both' ? ['b0', 'b1'] : [v];
  }

  // Protocol: {ailab: 1, cmd: 'ask'|'fault'|'importAsset'|'tamper'|'reset', value}
  function send(cmd, value) {
    var names = targets();
    names.forEach(function (n) {
      var f = FRAMES[n];
      try {
        f.el.contentWindow.postMessage(
          { ailab: 1, cmd: cmd, value: value === undefined ? null : value },
          f.origin
        );
      } catch (e) { /* iframe not ready */ }
    });
    var shown = value === undefined || value === null ? '' : ' ' + JSON.stringify(value);
    statusEl.textContent = 'Đã gửi ' + cmd + shown + ' → ' +
      names.map(function (n) { return n.toUpperCase(); }).join(' + ');
  }

  Array.prototype.forEach.call(document.querySelectorAll('button.ask'), function (b) {
    b.addEventListener('click', function () { send('ask', b.dataset.question); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('button.asset'), function (b) {
    b.addEventListener('click', function () { send('importAsset', b.dataset.asset); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('input[name="fault"]'), function (r) {
    r.addEventListener('change', function () { send('fault', r.value === '' ? null : r.value); });
  });
  document.getElementById('tamper').addEventListener('change', function (e) {
    send('tamper', e.target.checked);
  });
  document.getElementById('reset').addEventListener('click', function () {
    send('reset');
  });
})();
</script>
</body>
</html>
