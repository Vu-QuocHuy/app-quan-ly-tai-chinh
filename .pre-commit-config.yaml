repos:
  - repo: local
    hooks:
      - id: dart-format
        name: Dart format
        entry: dart format --output=none --set-exit-if-changed lib test
        language: system
        pass_filenames: false
      - id: flutter-analyze
        name: Flutter analyze
        entry: flutter analyze
        language: system
        pass_filenames: false
      - id: backend-check
        name: Backend TypeScript check
        entry: npm --prefix backend run check
        language: system
        pass_filenames: false
