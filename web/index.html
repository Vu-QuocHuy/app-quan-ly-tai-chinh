<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ứng dụng quản lý thu chi cá nhân local-first.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Finmi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Finmi</title>
  <link rel="manifest" href="manifest.json">

  <!-- ZXing library for mobile_scanner on Flutter Web -->
  <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js" type="application/javascript"></script>
</head>
<body>
  <script>
    (function() {
      // Yêu cầu quyền camera qua trình duyệt và giải phóng track sau khi được cấp
      window._finmiRequestCameraPermission = async function() {
        console.log("[Finmi] Requesting browser camera permission...");
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          console.warn("[Finmi] navigator.mediaDevices.getUserMedia is not supported in this browser context.");
          return false;
        }
        try {
          var stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" }
          });
          stream.getTracks().forEach(function(track) { track.stop(); });
          return true;
        } catch (err1) {
          try {
            var stream2 = await navigator.mediaDevices.getUserMedia({ video: true });
            stream2.getTracks().forEach(function(track) { track.stop(); });
            return true;
          } catch (err2) {
            console.warn("Camera request error:", err2);
            return false;
          }
        }
      };

      var recognition = null;
      var speechGeneration = 0;
      var speechStream = null;
      var speechContext = null;
      var speechTimer = null;
      function releaseSpeechAudio() {
        if (speechTimer) clearInterval(speechTimer);
        speechTimer = null;
        if (speechStream) speechStream.getTracks().forEach(function(t) { t.stop(); });
        speechStream = null;
        if (speechContext) speechContext.close().catch(function() {});
        speechContext = null;
      }
      window._finmiSpeechSupported = function() {
        return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
      };
      window._finmiStartSpeech = function(lang, onResult, onError, onEnd, onSilence) {
        var generation = ++speechGeneration;
        releaseSpeechAudio();
        var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          if (onError) onError("Trình duyệt không hỗ trợ Web Speech API");
          return;
        }

        function runRecognition() {
          if (generation !== speechGeneration) return;
          try {
            if (recognition) {
              try { recognition.abort(); } catch(e) {}
              recognition = null;
            }
            recognition = new SpeechRec();
            var activeRecognition = recognition;
            recognition.lang = lang || 'vi-VN';
            recognition.interimResults = true;
            recognition.continuous = true;
            recognition.onresult = function(event) {
              if (generation !== speechGeneration) return;
              var text = "";
              for (var i = 0; i < event.results.length; i++) {
                text += event.results[i][0].transcript;
              }
              if (onResult) onResult(text);
            };
            recognition.onerror = function(err) {
              if (generation !== speechGeneration) return;
              releaseSpeechAudio();
              console.warn("Finmi Speech error:", err);
              var msg = err.error || "Lỗi micro";
              if (err.error === 'not-allowed') {
                msg = "Chưa được cấp quyền micro. Hãy bấm vào biểu tượng ổ khóa/quyền trang trên thanh địa chỉ để bật micro.";
              }
              if (onError) onError(msg);
            };
            recognition.onend = function() {
              if (generation !== speechGeneration) return;
              releaseSpeechAudio();
              if (recognition === activeRecognition) recognition = null;
              if (onEnd) onEnd();
            };
            recognition.start();
          } catch (e) {
            console.warn("Finmi Speech start error:", e);
            if (onError) onError(e.message || String(e));
          }
        }

        // Explicitly trigger the browser's native microphone permission prompt first
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
            if (generation !== speechGeneration) {
              stream.getTracks().forEach(function(t) { t.stop(); });
              return;
            }
            speechStream = stream;
            try {
              var AudioCtx = window.AudioContext || window.webkitAudioContext;
              speechContext = new AudioCtx();
              speechContext.resume().catch(function() {});
              var source = speechContext.createMediaStreamSource(stream);
              var analyser = speechContext.createAnalyser();
              analyser.fftSize = 2048;
              source.connect(analyser);
              var samples = new Float32Array(analyser.fftSize);
              var candidate = null, lastSpeech = null, hasSpeech = false;
              speechTimer = setInterval(function() {
                if (generation !== speechGeneration) return;
                analyser.getFloatTimeDomainData(samples);
                var sum = 0;
                for (var n = 0; n < samples.length; n++) sum += samples[n] * samples[n];
                var db = 20 * Math.log10(Math.max(0.000001, Math.sqrt(sum / samples.length)));
                var now = performance.now();
                if (db > -40) {
                  if (candidate === null) candidate = now;
                  if (now - candidate >= 150) { hasSpeech = true; lastSpeech = now; }
                } else { candidate = null; }
                if (hasSpeech && lastSpeech !== null && now - lastSpeech >= 2500) {
                  clearInterval(speechTimer); speechTimer = null;
                  if (onSilence) onSilence();
                }
              }, 100);
            } catch(e) {
              // Recognition still works without energy detection. Keep manual
              // stop / hard limit rather than auto-sending by guessed silence.
              releaseSpeechAudio();
            }
            runRecognition();
          }).catch(function(err) {
            if (generation !== speechGeneration) return;
            console.warn("Finmi getUserMedia permission prompt error:", err);
            if (onError) {
              onError("Trình duyệt chưa cho phép dùng micro. Nếu đang chạy qua khung nhúng, hãy mở ứng dụng ở tab riêng hoặc cấp quyền micro trên thanh địa chỉ.");
            }
          });
        } else {
          runRecognition();
        }
      };
      window._finmiAbortSpeech = function() {
        speechGeneration++;
        releaseSpeechAudio();
        if (recognition) { try { recognition.abort(); } catch(e) {} }
        recognition = null;
      };
      window._finmiStopSpeech = function() {
        releaseSpeechAudio();
        if (recognition) {
          try {
            recognition.stop();
          } catch(e) {}
        } else {
          // Invalidate a pending permission request when cancelled before start.
          speechGeneration++;
        }
      };
      window._finmiGetCookie = function(name) {
        try {
          var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
          return match ? decodeURIComponent(match[2]) : '';
        } catch(e) {
          return '';
        }
      };
      window._finmiSetCookie = function(name, val) {
        try {
          var d = new Date();
          d.setTime(d.getTime() + (7*24*60*60*1000));
          document.cookie = name + "=" + encodeURIComponent(val) + ";path=/;expires=" + d.toUTCString() + ";SameSite=Lax";
        } catch(e) {}
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
