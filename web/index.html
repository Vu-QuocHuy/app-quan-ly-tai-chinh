<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ứng dụng quản lý thu chi cá nhân local-first.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Finmi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Finmi</title>
  <link rel="manifest" href="manifest.json">

  <!-- ZXing library for mobile_scanner on Flutter Web -->
  <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js" type="application/javascript"></script>
</head>
<body>
  <script>
    (function() {
      // Yêu cầu quyền camera qua trình duyệt và giải phóng track sau khi được cấp
      window._finmiRequestCameraPermission = async function() {
        console.log("[Finmi] Requesting browser camera permission...");
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          console.warn("[Finmi] navigator.mediaDevices.getUserMedia is not supported in this browser context.");
          return false;
        }
        try {
          var stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" }
          });
          stream.getTracks().forEach(function(track) { track.stop(); });
          return true;
        } catch (err1) {
          try {
            var stream2 = await navigator.mediaDevices.getUserMedia({ video: true });
            stream2.getTracks().forEach(function(track) { track.stop(); });
            return true;
          } catch (err2) {
            console.warn("Camera request error:", err2);
            return false;
          }
        }
      };
      window._finmiGetCookie = function(name) {
        try {
          var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
          return match ? decodeURIComponent(match[2]) : '';
        } catch(e) {
          return '';
        }
      };
      window._finmiSetCookie = function(name, val) {
        try {
          var d = new Date();
          d.setTime(d.getTime() + (7*24*60*60*1000));
          document.cookie = name + "=" + encodeURIComponent(val) + ";path=/;expires=" + d.toUTCString() + ";SameSite=Lax";
        } catch(e) {}
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
